<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="妊娠中から赤ちゃんの成長までを記録し、家族と共有できる「すくすくノート」">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111413" media="(prefers-color-scheme: dark)">
  <title>すくすくノート</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title"><span class="logo" data-icon="logo"></span><span class="app-name">すくすくノート</span></h1>
    <button class="child-switch" id="child-switch" data-action="open-children" hidden aria-label="表示する子どもを切り替える"></button>
    <span class="header-actions">
      <button class="icon-btn sync-status" id="sync-status" data-action="open-settings" data-page="family" hidden aria-label="家族共有の同期状態"></button>
      <button class="icon-btn" data-action="open-settings" aria-label="設定"><span data-icon="settings"></span></button>
    </span>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="メインメニュー">
    <button data-tab="home" class="active"><span data-icon="home"></span>ホーム</button>
    <button data-tab="growth"><span data-icon="growth"></span>成長</button>
    <button data-tab="album"><span data-icon="album"></span>アルバム</button>
    <button data-tab="mom"><span data-icon="mom"></span>ママ</button>
    <button data-tab="lists"><span data-icon="checklist"></span>準備</button>
  </nav>

  <dialog id="settings" class="sheet settings">
    <form id="settings-form" method="dialog">
      <div class="settings-head">
        <button type="button" class="icon-btn back" data-action="settings-back" aria-label="設定のメニューに戻る" hidden><span data-icon="chevronLeft"></span></button>
        <h2 id="settings-title">設定</h2>
        <button type="button" class="icon-btn" data-action="close-dialog" aria-label="閉じる"><span data-icon="close"></span></button>
      </div>

      <nav class="settings-menu" data-page="menu" aria-label="設定のメニュー">
        <button type="button" class="menu-row edit-only" data-action="settings-page" data-page="baby">
          <span class="menu-icon" data-icon="baby"></span>
          <span class="menu-body"><strong>赤ちゃん</strong><small id="menu-baby"></small></span>
          <span class="menu-chev" data-icon="chevronRight"></span>
        </button>
        <button type="button" class="menu-row edit-only" data-action="settings-page" data-page="mom">
          <span class="menu-icon" data-icon="mom"></span>
          <span class="menu-body"><strong>ママ</strong><small id="menu-mom"></small></span>
          <span class="menu-chev" data-icon="chevronRight"></span>
        </button>
        <button type="button" class="menu-row" data-action="settings-page" data-page="family">
          <span class="menu-icon" data-icon="users"></span>
          <span class="menu-body"><strong>家族と共有</strong><small id="menu-family"></small></span>
          <span class="menu-chev" data-icon="chevronRight"></span>
        </button>
        <button type="button" class="menu-row" data-action="settings-page" data-page="data">
          <span class="menu-icon" data-icon="download"></span>
          <span class="menu-body"><strong>データの管理</strong><small id="menu-data"></small></span>
          <span class="menu-chev" data-icon="chevronRight"></span>
        </button>
      </nav>

      <section data-page="baby" hidden>
        <label>ニックネーム・名前（任意）
          <input type="text" name="babyName" maxlength="20" placeholder="例: まめちゃん">
        </label>
        <label>出産予定日
          <input type="date" name="dueDate">
        </label>
        <p class="or">または</p>
        <label>最終月経の開始日から計算
          <input type="date" name="lmp">
        </label>
        <div class="actions">
          <button type="submit" class="btn primary">保存</button>
        </div>
        <h3>誕生・きょうだい</h3>
        <div class="settings-links">
          <button type="button" class="menu-row" data-action="open-birth">
            <span class="menu-icon" data-icon="gift"></span>
            <span class="menu-body"><strong>誕生を登録・編集</strong><small>生年月日・性別・生まれたときの大きさ</small></span>
            <span class="menu-chev" data-icon="chevronRight"></span>
          </button>
          <button type="button" class="menu-row" data-action="open-children">
            <span class="menu-icon" data-icon="users"></span>
            <span class="menu-body"><strong>きょうだいを追加・切り替え</strong><small>ふたり目以降の子どもの記録</small></span>
            <span class="menu-chev" data-icon="chevronRight"></span>
          </button>
        </div>
      </section>

      <section data-page="mom" hidden>
        <p class="muted small">体重記録の「増加の目安」の計算に使います。</p>
        <div class="row2">
          <label>身長 (cm)
            <input type="number" name="heightCm" min="100" max="220" step="0.1" inputmode="decimal">
          </label>
          <label>妊娠前の体重 (kg)
            <input type="number" name="preWeightKg" min="25" max="200" step="0.1" inputmode="decimal">
          </label>
        </div>
        <div class="actions">
          <button type="submit" class="btn primary">保存</button>
        </div>
      </section>

      <section data-page="family" hidden>
        <section id="family-section" class="family"></section>
      </section>

      <section data-page="data" class="data-tools" hidden>
        <p class="muted small">記録と写真はこの端末のブラウザ内に保存されています。<span id="storage-usage"></span></p>
        <div class="settings-links">
          <button type="button" class="menu-row" data-action="export-zip">
            <span class="menu-icon" data-icon="download"></span>
            <span class="menu-body"><strong>すべてを ZIP で保存</strong><small>記録と写真・動画（元の画質）を 1 つのファイルに</small></span>
          </button>
          <button type="button" class="menu-row" data-action="export">
            <span class="menu-icon" data-icon="document"></span>
            <span class="menu-body"><strong>バックアップを保存</strong><small>記録だけの小さなファイル（写真は含みません）</small></span>
          </button>
          <label class="menu-row" id="import-label">
            <span class="menu-icon" data-icon="sync"></span>
            <span class="menu-body"><strong>バックアップから復元</strong><small>今の記録は置き換わります</small></span>
            <input type="file" accept="application/json" data-action="import" hidden>
          </label>
        </div>
        <h3>削除</h3>
        <button type="button" class="btn danger" data-action="reset">すべてのデータを削除</button>
      </section>
    </form>
  </dialog>

  <dialog id="birth" class="sheet">
    <form id="birth-form" method="dialog">
      <h2>誕生の登録</h2>
      <label>生年月日
        <input type="date" name="birthDate" required>
      </label>
      <p class="muted small" id="birth-gest"></p>
      <fieldset class="seg-field">
        <legend>性別</legend>
        <label><input type="radio" name="sex" value="female"><span>女の子</span></label>
        <label><input type="radio" name="sex" value="male"><span>男の子</span></label>
        <label><input type="radio" name="sex" value="" checked><span>未設定</span></label>
      </fieldset>
      <p class="muted small">性別は、発育曲線（男女別）の表示に使います。</p>
      <h3>生まれたときの大きさ（任意）</h3>
      <div class="row2">
        <label>体重 (g)
          <input type="number" name="weightG" min="300" max="6000" step="1" inputmode="numeric" placeholder="例: 3050">
        </label>
        <label>身長 (cm)
          <input type="number" name="lengthCm" min="20" max="65" step="0.1" inputmode="decimal" placeholder="例: 49.5">
        </label>
        <label>頭囲 (cm)
          <input type="number" name="headCm" min="15" max="45" step="0.1" inputmode="decimal">
        </label>
        <label>胸囲 (cm)
          <input type="number" name="chestCm" min="15" max="45" step="0.1" inputmode="decimal">
        </label>
      </div>
      <div class="actions">
        <button type="button" class="btn danger" data-action="clear-birth" id="clear-birth">登録を取り消す</button>
        <button type="button" class="btn ghost" data-action="close-dialog">キャンセル</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="milestone" class="sheet">
    <form id="milestone-form" method="dialog">
      <h2 id="milestone-title">できごとを記録</h2>
      <input type="hidden" name="id">
      <input type="hidden" name="templateId">
      <label>日付
        <input type="date" name="date" required>
      </label>
      <label>タイトル
        <input type="text" name="title" maxlength="40" required placeholder="例: 初めて「ママ」と言った">
      </label>
      <label>メモ（任意）
        <textarea name="note" rows="3" maxlength="1000"></textarea>
      </label>
      <div class="photo-pick">
        <label class="btn ghost pick-btn"><span data-icon="camera"></span>写真・動画を追加
          <input type="file" name="photos" accept="image/*,video/*" multiple hidden data-action="pick-preview">
        </label>
        <div class="pick-preview" aria-live="polite"></div>
      </div>
      <div class="actions">
        <button type="button" class="btn danger edit-only" data-action="delete-milestone" id="delete-milestone">削除</button>
        <button type="button" class="btn ghost" data-action="close-dialog">閉じる</button>
        <button type="submit" class="btn primary edit-only">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="children" class="sheet">
    <div id="children-body"></div>
  </dialog>

  <dialog id="account" class="sheet">
    <div id="account-body"></div>
  </dialog>

  <dialog id="viewer" class="viewer">
    <div class="viewer-top">
      <span id="viewer-meta"></span>
      <button class="icon-btn" data-action="close-dialog" aria-label="閉じる"><span data-icon="close"></span></button>
    </div>
    <div class="viewer-body">
      <button class="icon-btn nav" data-action="viewer-prev" aria-label="前の写真"><span data-icon="chevronLeft"></span></button>
      <img id="viewer-img" alt="">
      <video id="viewer-video" controls playsinline preload="metadata" hidden></video>
      <button class="icon-btn nav" data-action="viewer-next" aria-label="次の写真"><span data-icon="chevronRight"></span></button>
    </div>
    <form id="viewer-form" class="viewer-form">
      <div class="row2">
        <label>撮影日
          <input type="date" name="takenAt" required>
        </label>
        <label>ひとこと
          <input type="text" name="caption" maxlength="100" placeholder="キャプション">
        </label>
      </div>
      <div class="actions wrap">
        <button type="submit" class="btn primary small edit-only">保存</button>
        <button type="button" class="btn ghost small edit-only monthly-btn" data-action="viewer-monthly" hidden></button>
        <button type="button" class="btn ghost small" data-action="viewer-download">端末に保存</button>
        <button type="button" class="btn danger small edit-only" data-action="viewer-delete">削除</button>
      </div>
    </form>
    <div id="viewer-social" class="viewer-social"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
